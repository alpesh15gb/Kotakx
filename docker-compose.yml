name: sahi-kotak-terminal

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kotak-terminal-backend
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    environment:
      KOTAK_TERMINAL_DB_PATH: /app/data/trading_terminal.db
      NEO_HOLDINGS_CACHE_DIR: /tmp/kotak-holdings-cache
    ports:
      # Dedicated host loopback port for system-level Nginx.
      - "127.0.0.1:18741:8000"
    volumes:
      - backend_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Empty preserves the existing client routing: same-origin /api/* and /ws/*.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    container_name: kotak-terminal-web
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18740:3001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=1001,gid=1001,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "0.75"
    mem_limit: 512m
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend_data:
