# System-level Nginx configuration for the Kotak Neo terminal.
# Replace trade.example.com with the deployed DNS name before installation.
# Issue the Let's Encrypt certificate first; see README.md. Certbot is not a container.
# Docker publishes the web and API on host loopback ports 18740 and 18741.

map $http_upgrade $kotakx_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kotakx_backend {
    server 127.0.0.1:18741;
    keepalive 32;
}

upstream kotakx_web {
    server 127.0.0.1:18740;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name trade.example.com;
    server_tokens off;

    # Keep HTTP-01 renewal available without redirecting the challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kotakx-acme;
    }

    location / {
        return 301 https://trade.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trade.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/trade.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KotakxTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # FastAPI health endpoint used by the web client and operations checks.
    location = /health {
        proxy_pass http://kotakx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Preserve the /api/ prefix: FastAPI routes already include it.
    location /api/ {
        proxy_pass http://kotakx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Exact application WebSocket endpoints; no URI suffix is passed to FastAPI.
    location = /ws/marketfeed {
        proxy_pass http://kotakx_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kotakx_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location = /ws/orderfeed {
        proxy_pass http://kotakx_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kotakx_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Next.js standalone server.
    location / {
        proxy_pass http://kotakx_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
